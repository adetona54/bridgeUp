name: Deploy BridgeUp to GitHub Pages

on:
  push:
    branches: [claude/gallant-bardeen-65lava]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NODE_ENV: production

      - name: Configure GitHub Pages (force Actions mode)
        run: |
          # Try PUT first (update existing Pages config to workflow/Actions mode)
          HTTP=$(curl -s -o /tmp/pages_resp.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}')
          echo "PUT /pages status: $HTTP"
          cat /tmp/pages_resp.json
          # If PUT failed (Pages doesn't exist yet), create it via POST
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "204" ]; then
            HTTP2=$(curl -s -o /tmp/pages_resp2.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/pages \
              -d '{"build_type":"workflow"}')
            echo "POST /pages status: $HTTP2"
            cat /tmp/pages_resp2.json
          fi

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - id: deployment
        uses: actions/deploy-pages@v4
